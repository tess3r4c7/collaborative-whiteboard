name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/whiteboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/whiteboard-frontend

jobs:
  # ─── Stage 1: Lint ───
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ─── Stage 2: Test ───
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm test
        env:
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: test

  # ─── Stage 3: Build Docker Images ───
  build:
    name: 🐳 Build Images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://whiteboard-backend.whiteboard.svc.cluster.local:5000 \
            -t ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            ./frontend

      - name: Save images for subsequent jobs
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }} \
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }} \
            -o /tmp/images.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/images.tar
          retention-days: 1

  # ─── Stage 4: Security Scan ───
  scan:
    name: 🛡️ Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load images
        run: docker load -i /tmp/images.tar

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.BACKEND_IMAGE }}:${{ needs.build.outputs.image_tag }}"
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.FRONTEND_IMAGE }}:${{ needs.build.outputs.image_tag }}"
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ─── Stage 5: Push to GHCR ───
  push:
    name: 📦 Push to GHCR
    runs-on: ubuntu-latest
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load images
        run: docker load -i /tmp/images.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag with commit SHA
        run: |
          TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
          docker tag ${{ env.BACKEND_IMAGE }}:${TAG} ${{ env.BACKEND_IMAGE }}:latest
          docker tag ${{ env.FRONTEND_IMAGE }}:${TAG} ${{ env.FRONTEND_IMAGE }}:latest

      - name: Push backend image
        run: |
          TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
          docker push ${{ env.BACKEND_IMAGE }}:${TAG}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Push frontend image
        run: |
          TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
          docker push ${{ env.FRONTEND_IMAGE }}:${TAG}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # ─── Stage 6: Deploy to Kubernetes ───
  deploy:
    name: 🚀 Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update image tags in manifests
        run: |
          TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s|image: ghcr.io/.*/whiteboard-backend:.*|image: ${{ env.BACKEND_IMAGE }}:${TAG}|g" k8s/backend-deployment.yaml
          sed -i "s|image: ghcr.io/.*/whiteboard-frontend:.*|image: ${{ env.FRONTEND_IMAGE }}:${TAG}|g" k8s/frontend-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/whiteboard-backend -n whiteboard --timeout=120s
          kubectl rollout status deployment/whiteboard-frontend -n whiteboard --timeout=120s

      - name: Verify deployment health
        run: |
          kubectl get pods -n whiteboard
          kubectl get services -n whiteboard
