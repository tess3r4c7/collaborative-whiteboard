apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboard-backend
  namespace: whiteboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whiteboard-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: whiteboard-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/tess3r4c7/whiteboard-backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: whiteboard-config
            - secretRef:
                name: whiteboard-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 250m
