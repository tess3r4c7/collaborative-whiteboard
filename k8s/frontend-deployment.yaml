apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboard-frontend
  namespace: whiteboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whiteboard-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: whiteboard-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/tess3r4c7/whiteboard-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
